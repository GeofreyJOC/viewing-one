name: Keep Warm

on:
  schedule:
    # Every 4 minutes — prevents Vercel cold starts
    - cron: '*/4 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm viewing.one instance + MongoDB
        run: |
          curl -s -o /dev/null -w "db-status: %{http_code}\n" https://viewing.one/api/db-status
          curl -s -o /dev/null -w "landing: %{http_code}\n" https://viewing.one/
