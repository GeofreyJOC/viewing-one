<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Viewing.One</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d0d0d;
            color: #e8e4df;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        /* Subtle background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 25% 25%, rgba(201, 169, 110, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(201, 169, 110, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.01) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        /* Back link to home */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(232, 228, 223, 0.5);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.3s ease;
            margin-bottom: 24px;
        }
        .back-link:hover {
            color: #c9a96e;
        }
        .back-link svg {
            width: 16px;
            height: 16px;
        }

        /* Logo */
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 600;
            color: #e8e4df;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .logo span { color: #c9a96e; }

        .subtitle {
            color: rgba(232, 228, 223, 0.55);
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(232, 228, 223, 0.08);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease;
        }
        .card:focus-within {
            border-color: rgba(201, 169, 110, 0.25);
        }

        .card-header {
            margin-bottom: 28px;
        }
        .card-header h1 {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #e8e4df;
            margin-bottom: 4px;
        }
        .card-header p {
            font-size: 13px;
            color: rgba(232, 228, 223, 0.45);
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group:last-of-type {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: rgba(232, 228, 223, 0.5);
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(232, 228, 223, 0.12);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: #e8e4df;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input::placeholder {
            color: rgba(232, 228, 223, 0.25);
        }
        .form-group input:focus {
            border-color: #c9a96e;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.08);
        }
        .form-group input:-webkit-autofill {
            -webkit-text-fill-color: #e8e4df !important;
            -webkit-box-shadow: 0 0 0 100px #1a1a1a inset !important;
            transition: background-color 9999s ease-in-out 0s;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.3px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: #c9a96e;
            color: #0d0d0d;
        }
        .btn-primary:hover {
            background: #d4b87a;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(201, 169, 110, 0.2);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(13, 13, 13, 0.2);
            border-top-color: #0d0d0d;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .btn.loading .spinner { display: inline-block; }
        .btn.loading .btn-text { opacity: 0.7; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Messages */
        .msg {
            font-size: 13px;
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .msg-error {
            display: flex;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .msg-success {
            display: flex;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.2);
            color: #34d399;
        }
        .msg svg {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: rgba(232, 228, 223, 0.35);
        }
        .footer a {
            color: rgba(232, 228, 223, 0.6);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .footer a:hover {
            color: #c9a96e;
        }
        .footer .divider {
            margin: 0 10px;
            opacity: 0.3;
        }

        /* Decorative line under card */
        .card-accent {
            width: 40px;
            height: 2px;
            background: #c9a96e;
            border-radius: 2px;
            margin-bottom: 24px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body { padding: 16px; }
            .card { padding: 28px 24px; }
            .logo { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <a href="/" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
        </svg>
        Back to Viewing.One
    </a>

    <div class="logo">
        <span>Viewing</span>.One
    </div>
    <p class="subtitle">Agent dashboard — manage listings and bookings</p>

    <div class="card">
        <div class="card-header">
            <h1>Log in</h1>
            <p>Enter your credentials to access your dashboard</p>
        </div>

        <div class="card-accent"></div>

        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="your@email.com" autocomplete="email" spellcheck="false">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
            <div style="margin-top:6px;"><a href="forgot-password.html" style="color:rgba(232,228,223,0.4);font-size:12px;text-decoration:none;transition:color 0.3s;" onmouseover="this.style.color='#c9a96e'" onmouseout="this.style.color='rgba(232,228,223,0.4)'">Forgot password?</a></div>
        </div>

        <div class="msg" id="msg">
            <svg id="msgIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="msgText"></span>
        </div>

        <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">
            <span class="spinner"></span>
            <span class="btn-text">Log in</span>
        </button>
    </div>

    <div class="footer">
        <a href="register.html">Create an account</a>
        <span class="divider">·</span>
        <a href="/">Home</a>
    </div>
</div>

<script>
const API = '';

function showMsg(type, text) {
    var el = document.getElementById('msg');
    var icon = document.getElementById('msgIcon');
    el.className = 'msg';
    el.style.display = 'none';
    document.getElementById('msgText').textContent = '';

    if (!text) return;

    el.classList.add(type === 'error' ? 'msg-error' : 'msg-success');
    el.querySelector('span').textContent = text;
    icon.style.display = 'block';
    // Update icon paths
    if (type === 'error') {
        icon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
    } else {
        icon.innerHTML = '<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
    }
    el.style.display = 'flex';
}

async function doLogin() {
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var btn = document.getElementById('loginBtn');

    if (!email || !password) {
        showMsg('error', 'Please enter both email and password');
        return;
    }

    showMsg();
    btn.classList.add('loading');
    btn.disabled = true;

    try {
        var resp = await fetch(API + '/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        });
        var data = await resp.json();

        if (data.success && data.token) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('agent', JSON.stringify(data.agent || {}));
            showMsg('success', 'Logged in! Redirecting to dashboard\u2026');
            setTimeout(function() {
                window.location.href = data.dashboardUrl || '/dashboard.html';
            }, 800);
        } else {
            throw new Error(data.message || 'Login failed');
        }
    } catch (e) {
        showMsg('error', e.message);
        btn.classList.remove('loading');
        btn.disabled = false;
    }
}

// Enter key support
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
