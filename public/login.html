<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Viewing.One</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .card {
            background: white; border-radius: 16px; padding: 40px; max-width: 420px; width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .card h1 { font-size: 24px; margin-bottom: 4px; color: #1a1a2e; }
        .card p { color: #666; font-size: 14px; margin-bottom: 24px; }
        .card .logo { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
        .card .logo span { color: #4f46e5; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 6px; color: #333; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 15px; transition: border-color 0.2s;
        }
        .form-group input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }

        .btn {
            width: 100%; padding: 12px 16px; border-radius: 8px; font-weight: 600; font-size: 15px;
            border: none; cursor: pointer; transition: all 0.2s; margin-top: 8px;
        }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .error { color: #dc2626; font-size: 13px; margin-top: 8px; display: none; }
        .success { color: #10b981; font-size: 13px; margin-top: 8px; display: none; text-align: center; }

        .footer { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .footer a { color: #4f46e5; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo"><span>Viewing</span>.One</div>
    <h1>Welcome back</h1>
    <p>Log in to manage your listings and booking slots</p>

    <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
    </div>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg">Logged in! Redirecting...</div>

    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Log in</button>

    <div class="footer">
        Don't have an account? <a href="register.html">Sign up</a>
    </div>
</div>

<script>
const API = '';

async function doLogin() {
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var errorEl = document.getElementById('errorMsg');
    var btn = document.getElementById('loginBtn');

    if (!email || !password) {
        errorEl.textContent = 'Please enter both email and password';
        errorEl.style.display = 'block';
        return;
    }

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
        var resp = await fetch(API + '/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        });
        var data = await resp.json();

        if (data.success && data.token) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('agent', JSON.stringify(data.agent || {}));
            document.getElementById('successMsg').style.display = 'block';
            setTimeout(function() {
                window.location.href = data.dashboardUrl || '/dashboard.html';
            }, 800);
        } else {
            throw new Error(data.message || 'Login failed');
        }
    } catch (e) {
        errorEl.textContent = e.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Log in';
    }
}

// Enter key support
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
