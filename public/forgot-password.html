<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Viewing.One</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d0d0d;
            color: #e8e4df;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 25% 25%, rgba(201, 169, 110, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(201, 169, 110, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .wrapper { position: relative; z-index: 1; width: 100%; max-width: 420px; }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: rgba(232, 228, 223, 0.5); font-size: 13px; font-weight: 500;
            text-decoration: none; transition: color 0.3s ease; margin-bottom: 24px;
        }
        .back-link:hover { color: #c9a96e; }
        .back-link svg { width: 16px; height: 16px; }
        .logo { font-family: 'Playfair Display', serif; font-size: 28px; color: #fff; margin-bottom: 4px; }
        .logo span { color: #c9a96e; }
        .subtitle { font-size: 13px; color: rgba(232, 228, 223, 0.4); margin-bottom: 28px; }
        .card { background: #141414; border-radius: 16px; padding: 36px 28px; border: 1px solid #1a1a1a; }
        .card h1 { font-family: 'Playfair Display', serif; font-size: 22px; color: #fff; margin-bottom: 4px; }
        .card p { font-size: 14px; color: rgba(232, 228, 223, 0.5); margin-bottom: 24px; }
        .card-accent { width: 40px; height: 2px; background: #c9a96e; border-radius: 2px; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: rgba(232, 228, 223, 0.7); margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px 16px; background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 14px;
            color: #e8e4df; outline: none; transition: border-color 0.3s ease;
        }
        .form-group input:focus { border-color: #c9a96e; }
        .form-group input::placeholder { color: rgba(232, 228, 223, 0.2); }
        .btn {
            width: 100%; padding: 14px 20px; border-radius: 10px;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
            border: none; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: #c9a96e; color: #0d0d0d; }
        .btn-primary:hover { background: #d4b87a; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(201, 169, 110, 0.2); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(13, 13, 13, 0.2); border-top-color: #0d0d0d; border-radius: 50%; animation: spin 0.6s linear infinite; }
        .btn.loading .spinner { display: inline-block; }
        .btn.loading .btn-text { opacity: 0.7; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .msg { font-size: 13px; margin-top: 12px; padding: 10px 14px; border-radius: 8px; display: none; align-items: center; gap: 8px; }
        .msg-success { display: flex; background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.2); color: #34d399; }
        .msg-error { display: flex; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; }
        .msg-info { display: flex; background: rgba(79, 70, 229, 0.1); border: 1px solid rgba(79, 70, 229, 0.2); color: #818cf8; }
        .footer { text-align: center; margin-top: 20px; font-size: 13px; color: rgba(232, 228, 223, 0.35); }
        .footer a { color: rgba(232, 228, 223, 0.6); text-decoration: none; transition: color 0.3s ease; }
        .footer a:hover { color: #c9a96e; }
        @media (max-width: 520px) { body { padding: 16px; } .card { padding: 28px 20px; } }
    </style>
</head>
<body>
<div class="wrapper">
    <a href="login.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to login
    </a>
    <div class="logo"><span>Viewing</span>.One</div>
    <div class="subtitle">Reset your password</div>
    <div class="card">
        <h1>Forgot your password?</h1>
        <p>Enter your email and we'll send you a reset link.</p>
        <div class="card-accent"></div>

        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
        </div>

        <div class="msg" id="message">
            <span id="messageText"></span>
        </div>

        <button class="btn btn-primary" id="resetBtn" onclick="sendResetLink()">
            <span class="btn-text">Send reset link</span>
            <span class="spinner"></span>
        </button>

        <div class="footer">
            Remember your password? <a href="login.html">Log in</a>
        </div>
    </div>
</div>

<script>
var API = '';

async function sendResetLink() {
    var email = document.getElementById('email').value.trim();
    var msgEl = document.getElementById('message');
    var textEl = document.getElementById('messageText');
    var btn = document.getElementById('resetBtn');

    if (!email) {
        textEl.textContent = 'Please enter your email address';
        msgEl.className = 'msg msg-error';
        return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    msgEl.className = 'msg';

    try {
        var resp = await fetch(API + '/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });
        var data = await resp.json();

        textEl.textContent = data.message || 'If an account with this email exists, a reset link has been sent.';
        msgEl.className = 'msg msg-success';
        btn.textContent = 'Check your inbox';
        btn.disabled = true;
    } catch (e) {
        textEl.textContent = 'Something went wrong. Please try again.';
        msgEl.className = 'msg msg-error';
        btn.disabled = false;
        btn.classList.remove('loading');
    }
}
</script>
</body>
</html>
