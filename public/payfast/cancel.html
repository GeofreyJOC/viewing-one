<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - Viewing.One</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; border-radius: 16px; padding: 48px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 440px; }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 24px; color: #333; margin-bottom: 8px; }
        p { color: #666; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
        .btn { display: inline-block; background: #4f46e5; color: white; padding: 12px 32px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; }
        .btn:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">↩️</div>
        <h1>Payment Cancelled</h1>
        <p>No problem — your upgrade was not processed. You can try again anytime from your dashboard.</p>
        <a href="/dashboard.html" class="btn">Back to Dashboard</a>
    </div>
    <script>
        setTimeout(function() { window.location.href = '/dashboard.html'; }, 5000);
    </script>
</body>
</html>
