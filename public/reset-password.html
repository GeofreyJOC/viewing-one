<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Viewing.One</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d0d0d;
            color: #e8e4df;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 25% 25%, rgba(201, 169, 110, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(201, 169, 110, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .wrapper { position: relative; z-index: 1; width: 100%; max-width: 420px; }
        .logo { font-family: 'Playfair Display', serif; font-size: 28px; color: #fff; margin-bottom: 4px; text-align: center; }
        .logo span { color: #c9a96e; }
        .subtitle { font-size: 13px; color: rgba(232, 228, 223, 0.4); margin-bottom: 28px; text-align: center; }
        .card { background: #141414; border-radius: 16px; padding: 36px 28px; border: 1px solid #1a1a1a; }
        .card h1 { font-family: 'Playfair Display', serif; font-size: 22px; color: #fff; margin-bottom: 4px; }
        .card p { font-size: 14px; color: rgba(232, 228, 223, 0.5); margin-bottom: 24px; }
        .card-accent { width: 40px; height: 2px; background: #c9a96e; border-radius: 2px; margin: 0 auto 24px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: rgba(232, 228, 223, 0.7); margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px 16px; background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 14px;
            color: #e8e4df; outline: none; transition: border-color 0.3s ease;
        }
        .form-group input:focus { border-color: #c9a96e; }
        .form-group input::placeholder { color: rgba(232, 228, 223, 0.2); }
        .pw-strength { font-size: 12px; margin-top: 4px; color: rgba(232, 228, 223, 0.3); height: 18px; }
        .btn {
            width: 100%; padding: 14px 20px; border-radius: 10px;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
            border: none; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: #c9a96e; color: #0d0d0d; }
        .btn-primary:hover { background: #d4b87a; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(201, 169, 110, 0.2); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(13, 13, 13, 0.2); border-top-color: #0d0d0d; border-radius: 50%; animation: spin 0.6s linear infinite; }
        .btn.loading .spinner { display: inline-block; }
        .btn.loading .btn-text { opacity: 0.7; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .msg { font-size: 13px; margin-top: 12px; padding: 10px 14px; border-radius: 8px; display: none; align-items: center; gap: 8px; }
        .msg-success { display: flex; background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.2); color: #34d399; }
        .msg-error { display: flex; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; }
        .footer { text-align: center; margin-top: 20px; font-size: 13px; color: rgba(232, 228, 223, 0.35); }
        .footer a { color: rgba(232, 228, 223, 0.6); text-decoration: none; transition: color 0.3s ease; }
        .footer a:hover { color: #c9a96e; }
        .expired { text-align: center; padding: 20px; }
        .expired h2 { font-family: 'Playfair Display', serif; font-size: 20px; color: #fff; margin-bottom: 8px; }
        .expired p { font-size: 14px; color: rgba(232, 228, 223, 0.5); }
        @media (max-width: 520px) { body { padding: 16px; } .card { padding: 28px 20px; } }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="logo"><span>Viewing</span>.One</div>
    <div class="subtitle">Choose a new password</div>
    <div class="card" id="resetCard">
        <h1 id="cardTitle">Set new password</h1>
        <p id="cardDesc">Enter your new password below.</p>
        <div class="card-accent"></div>

        <div id="resetForm">
            <div class="form-group">
                <label for="password">New password</label>
                <input type="password" id="password" placeholder="Min 6 characters" autocomplete="new-password" onkeyup="checkStrength()">
                <div class="pw-strength" id="strengthText"></div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" placeholder="Type it again" autocomplete="new-password">
            </div>

            <div class="msg" id="message">
                <span id="messageText"></span>
            </div>

            <button class="btn btn-primary" id="resetBtn" onclick="doReset()">
                <span class="btn-text">Reset password</span>
                <span class="spinner"></span>
            </button>
        </div>

        <div id="expiredView" class="expired" style="display:none;">
            <h2>🔗 Link expired</h2>
            <p>This reset link is no longer valid. Please request a new one.</p>
            <a href="forgot-password.html" class="btn btn-primary" style="display:block;margin-top:20px;text-decoration:none;">Request new link</a>
        </div>

        <div class="footer" style="margin-top:20px;">
            <a href="login.html">Back to login</a>
        </div>
    </div>
</div>

<script>
var API = '';
var urlParams = new URLSearchParams(window.location.search);
var token = urlParams.get('token');
var email = urlParams.get('email');

if (!token || !email) {
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('expiredView').style.display = 'block';
    document.getElementById('cardTitle').textContent = '🔗 Invalid link';
    document.getElementById('cardDesc').textContent = 'This reset link is missing required information.';
}

function checkStrength() {
    var pw = document.getElementById('password').value;
    var el = document.getElementById('strengthText');
    if (pw.length === 0) { el.textContent = ''; return; }
    if (pw.length < 6) { el.textContent = 'Too short'; el.style.color = '#f87171'; return; }
    if (pw.length >= 8 && /[A-Z]/.test(pw) && /[0-9]/.test(pw)) { el.textContent = 'Strong password ✓'; el.style.color = '#34d399'; return; }
    el.textContent = 'Good'; el.style.color = '#fbbf24';
}

async function doReset() {
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirmPassword').value;
    var msgEl = document.getElementById('message');
    var textEl = document.getElementById('messageText');
    var btn = document.getElementById('resetBtn');

    if (!password || password.length < 6) {
        textEl.textContent = 'Password must be at least 6 characters';
        msgEl.className = 'msg msg-error';
        return;
    }
    if (password !== confirm) {
        textEl.textContent = 'Passwords do not match';
        msgEl.className = 'msg msg-error';
        return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    msgEl.className = 'msg';

    try {
        var resp = await fetch(API + '/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, email: email, password: password })
        });
        var data = await resp.json();

        if (data.success) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('cardTitle').textContent = '✅ Password reset!';
            document.getElementById('cardDesc').textContent = 'You can now log in with your new password.';
            document.getElementById('resetCard').innerHTML += '<a href="login.html" class="btn btn-primary" style="display:block;margin-top:16px;text-decoration:none;">Go to login</a>';
        } else {
            textEl.textContent = data.message || 'Reset failed. Please request a new link.';
            msgEl.className = 'msg msg-error';
            btn.disabled = false;
            btn.classList.remove('loading');
        }
    } catch (e) {
        textEl.textContent = 'Something went wrong. Please try again.';
        msgEl.className = 'msg msg-error';
        btn.disabled = false;
        btn.classList.remove('loading');
    }
}
</script>
</body>
</html>
