<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewing.One — Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117; color: #e2e8f0; min-height: 100vh;
        }

        /* Login Screen */
        #loginScreen {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: #0f1117; z-index: 100;
        }
        #loginScreen.hidden { display: none; }
        .login-card {
            background: #1a1d27; border-radius: 16px; padding: 40px 36px;
            width: 380px; max-width: 90%; border: 1px solid #2a2d37;
        }
        .login-card .logo { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .login-card .logo span { color: #818cf8; }
        .login-card .sub { font-size: 13px; color: #64748b; margin-bottom: 28px; }
        .login-card h2 { font-size: 18px; margin-bottom: 20px; }
        .login-card .form-group { margin-bottom: 16px; }
        .login-card .form-group label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .login-card .form-group input {
            width: 100%; padding: 12px 14px; background: #0f1117; border: 1px solid #2a2d37;
            border-radius: 8px; color: #e2e8f0; font-size: 14px; outline: none;
        }
        .login-card .form-group input:focus { border-color: #818cf8; }
        .login-card .msg { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
        .login-card .msg.error { display: block; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #f87171; }
        .login-card button {
            width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer;
            font-weight: 600; font-size: 14px; background: #818cf8; color: white; transition: background 0.2s;
        }
        .login-card button:hover { background: #6366f1; }
        .login-card button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Dashboard */
        #dashboard { display: none; }
        #dashboard.active { display: block; }

        /* Header */
        .header {
            background: #1a1d27; border-bottom: 1px solid #2a2d37; padding: 16px 24px;
            display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50;
        }
        .header .logo { font-weight: 700; font-size: 18px; }
        .header .logo span { color: #818cf8; }
        .header .logo .badge { font-size: 10px; background: #818cf8; color: #0f1117; padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: 6px; vertical-align: middle; }
        .header .admin-info { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #64748b; }
        .header .admin-info button { background: transparent; border: 1px solid #2a2d37; color: #94a3b8; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .header .admin-info button:hover { border-color: #64748b; color: #e2e8f0; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px; }
        .stat-card { background: #1a1d27; border-radius: 12px; padding: 20px; border: 1px solid #2a2d37; }
        .stat-card .num { font-size: 32px; font-weight: 700; color: #818cf8; }
        .stat-card .label { font-size: 13px; color: #64748b; margin-top: 4px; }

        /* Content */
        .content { padding: 0 24px 24px; }
        .section { background: #1a1d27; border-radius: 12px; border: 1px solid #2a2d37; margin-bottom: 24px; overflow: hidden; }
        .section-header { padding: 16px 20px; border-bottom: 1px solid #2a2d37; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
        .section-body { padding: 8px; }

        /* Agent rows */
        .agent-row, .prop-row {
            display: grid; grid-template-columns: 1.2fr 1.5fr 0.8fr 0.8fr 0.5fr 150px;
            gap: 6px; padding: 10px 14px; align-items: center; font-size: 13px;
            border-bottom: 1px solid #1a1d27;
        }
        .agent-row.header, .prop-row.header { color: #64748b; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #2a2d37; }
        .agent-row:hover, .prop-row:hover { background: rgba(129,140,248,0.03); }
        .agent-row .name { font-weight: 600; }
        .agent-row .slug { color: #818cf8; font-family: monospace; font-size: 12px; }
        .agent-row .plan {
            display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
        }
        .plan-pro { background: rgba(129,140,248,0.15); color: #818cf8; }
        .plan-pro-annual { background: rgba(16,185,129,0.15); color: #34d399; }
        .plan-starter { background: rgba(148,163,184,0.15); color: #94a3b8; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .status-active { background: rgba(16,185,129,0.15); color: #34d399; }
        .status-suspended { background: rgba(239,68,68,0.15); color: #f87171; }
        .agent-row .actions { display: flex; gap: 4px; }
        .agent-row .actions button {
            padding: 4px 10px; border-radius: 5px; border: none; cursor: pointer; font-size: 11px; font-weight: 500;
        }
        .btn-warn { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .btn-warn:hover { background: rgba(251,191,36,0.25); }
        .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; }
        .btn-danger:hover { background: rgba(239,68,68,0.25); }
        .btn-sm-primary { background: rgba(129,140,248,0.15); color: #818cf8; }
        .btn-sm-primary:hover { background: rgba(129,140,248,0.25); }

        .empty-state { text-align: center; padding: 40px 20px; color: #64748b; font-size: 14px; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200;
            display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal { background: #1a1d27; border-radius: 14px; padding: 28px; max-width: 480px; width: 90%; border: 1px solid #2a2d37; }
        .modal h3 { font-size: 17px; margin-bottom: 16px; }
        .modal .form-group { margin-bottom: 14px; }
        .modal .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        .modal .form-group input, .modal .form-group select {
            width: 100%; padding: 10px 12px; background: #0f1117; border: 1px solid #2a2d37;
            border-radius: 6px; color: #e2e8f0; font-size: 13px; outline: none;
        }
        .modal .form-group select option { background: #1a1d27; }
        .modal .form-group input:focus, .modal .form-group select:focus { border-color: #818cf8; }
        .modal .btn-row { display: flex; gap: 8px; margin-top: 16px; }
        .modal .btn-row button { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
        .modal .btn-row .btn-cancel { background: #2a2d37; color: #94a3b8; }
        .modal .btn-row .btn-cancel:hover { background: #3a3d47; }
        .modal .btn-row .btn-primary { background: #818cf8; color: white; }
        .modal .btn-row .btn-primary:hover { background: #6366f1; }
        .modal .msg { font-size: 12px; padding: 8px 10px; border-radius: 6px; margin-bottom: 12px; display: none; }
        .modal .msg.success { display: block; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); color: #34d399; }
        .modal .msg.error { display: block; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #f87171; }

        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .agent-row, .prop-row { grid-template-columns: 1fr; gap: 4px; padding: 12px; }
            .agent-row.header, .prop-row.header { display: none; }
            .header { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
<!-- Login Screen -->
<div id="loginScreen">
    <div class="login-card">
        <div class="logo"><span>Viewing</span>.One</div>
        <div class="sub">Admin panel — manage agents and platform</div>
        <h2>Admin login</h2>
        <div class="form-group">
            <label for="adminEmail">Email</label>
            <input type="email" id="adminEmail" placeholder="admin@viewing.one" autocomplete="email">
        </div>
        <div class="form-group">
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" placeholder="Enter admin password" autocomplete="current-password">
        </div>
        <div class="msg" id="loginMsg"></div>
        <button id="loginBtn" onclick="adminLogin()">Log in to admin panel</button>
    </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
    <div class="header">
        <div class="logo"><span>Viewing</span>.One <span class="badge">ADMIN</span></div>
        <div class="admin-info">
            <span id="adminEmailDisplay"></span>
            <button onclick="loadAllData()">🔄 Refresh</button>
            <button onclick="adminLogout()">Log out</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="num" id="statAgents">-</div><div class="label">Agents</div></div>
        <div class="stat-card"><div class="num" id="statProperties">-</div><div class="label">Properties</div></div>
        <div class="stat-card"><div class="num" id="statActive">-</div><div class="label">Active listings</div></div>
        <div class="stat-card"><div class="num" id="statBookings">-</div><div class="label">Bookings</div></div>
    </div>

    <div class="content">
        <!-- Agents Section -->
        <div class="section">
            <div class="section-header">
                <span>👨‍💼 Agents</span>
                <span style="font-size:12px;color:#64748b;font-weight:400;" id="agentCountLabel">0 total</span>
            </div>
            <div class="section-body">
                <div class="agent-row header">
                    <span>Name</span><span>Slug</span><span>Plan</span><span>Status</span><span>Props</span><span>Actions</span>
                </div>
                <div id="agentList"><div class="empty-state">Loading agents...</div></div>
            </div>
        </div>

        <!-- Properties Section -->
        <div class="section">
            <div class="section-header">
                <span>🏠 Properties</span>
                <span style="font-size:12px;color:#64748b;font-weight:400;" id="propCountLabel">0 total</span>
            </div>
            <div class="section-body">
                <div class="prop-row header">
                    <span>Title</span><span>Agent</span><span>Price</span><span>Slug</span><span>Status</span><span>Created</span>
                </div>
                <div id="propertyList"><div class="empty-state">Loading properties...</div></div>
            </div>
        </div>
    </div>
</div>

<!-- Agent Detail Modal -->
<div class="modal-overlay" id="agentModal">
    <div class="modal">
        <h3 id="modalTitle">👤 Agent Details</h3>
        <div id="modalBody"></div>
        <div class="btn-row">
            <button class="btn-cancel" onclick="closeAgentModal()">Close</button>
        </div>
    </div>
</div>

<script>
var API = '';

// Check for existing admin token
var adminToken = localStorage.getItem('adminToken');
if (adminToken) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('dashboard').classList.add('active');
    document.getElementById('adminEmailDisplay').textContent = localStorage.getItem('adminEmail') || 'admin';
    loadAllData();
}

function adminLogin() {
    var email = document.getElementById('adminEmail').value.trim();
    var password = document.getElementById('adminPassword').value;
    var msgEl = document.getElementById('loginMsg');
    var btn = document.getElementById('loginBtn');

    if (!email || !password) {
        msgEl.textContent = 'Please enter email and password';
        msgEl.className = 'msg error';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in...';
    msgEl.className = 'msg';

    fetch(API + '/api/auth/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.success && data.token) {
            localStorage.setItem('adminToken', data.token);
            localStorage.setItem('adminEmail', data.admin.email);
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('adminEmailDisplay').textContent = data.admin.email;
            loadAllData();
        } else {
            msgEl.textContent = data.message || 'Invalid credentials';
            msgEl.className = 'msg error';
            btn.disabled = false;
            btn.textContent = 'Log in to admin panel';
        }
    })
    .catch(function() {
        msgEl.textContent = 'Connection error. Is the server running?';
        msgEl.className = 'msg error';
        btn.disabled = false;
        btn.textContent = 'Log in to admin panel';
    });
}

function adminLogout() {
    localStorage.removeItem('adminToken');
    localStorage.removeItem('adminEmail');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('dashboard').classList.remove('active');
}

function getToken() { return localStorage.getItem('adminToken'); }

function apiHeaders() {
    return {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + getToken()
    };
}

function loadAllData() {
    loadStats();
    loadAgents();
    loadProperties();
}

function loadStats() {
    fetch(API + '/api/admin/stats', { headers: { 'Authorization': 'Bearer ' + getToken() } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.success && data.stats) {
            document.getElementById('statAgents').textContent = data.stats.agents;
            document.getElementById('statProperties').textContent = data.stats.properties;
            document.getElementById('statActive').textContent = data.stats.activeProperties;
            document.getElementById('statBookings').textContent = data.stats.bookings;
        }
    })
    .catch(function(e) { console.error('Stats load error:', e); });
}

function loadAgents() {
    fetch(API + '/api/admin/agents', { headers: { 'Authorization': 'Bearer ' + getToken() } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var list = document.getElementById('agentList');
        var countLabel = document.getElementById('agentCountLabel');
        if (data.success && data.agents.length > 0) {
            countLabel.textContent = data.agents.length + ' total';
            list.innerHTML = data.agents.map(function(a) {
                var planClass = 'plan-' + (a.plan || 'starter');
                var statusClass = a.isActive !== false ? 'status-active' : 'status-suspended';
                var statusText = a.isActive !== false ? 'Active' : 'Suspended';
                var email = a.email || '—';
                var props = a.propertyCount || 0;
                return (
                    '<div class="agent-row">' +
                    '<div class="name">' + escapeHtml(a.name || 'Unnamed') + '</div>' +
                    '<div style="font-family:monospace;font-size:12px;"><a href="' + API + '/' + escapeHtml(a.slug || '') + '" target="_blank" style="color:#818cf8;text-decoration:none;">' + escapeHtml(a.slug || '?') + ' ↗</a></div>' +
                    '<div><span class="plan ' + planClass + '">' + (a.plan || 'starter').toUpperCase() + '</span></div>' +
                    '<div><span class="status-badge ' + statusClass + '">' + statusText + '</span></div>' +
                    '<div style="text-align:center;">' + props + '</div>' +
                    '<div class="actions" style="display:flex;gap:2px;">' +
                    '<button class="btn-sm-primary" style="flex:1;padding:3px 5px;font-size:11px;white-space:nowrap;" onclick="viewAgent(\'' + escapeHtml(a.email || a._id) + '\')">View</button>' +
                    '<button class="btn-warn" style="flex:1;padding:3px 5px;font-size:11px;white-space:nowrap;" onclick="resetAgentPw(\'' + escapeHtml(a.email || a._id) + '\', \'' + escapeHtml(a.name || 'Agent') + '\')">PW</button>' +
                    '<button class="' + (a.isActive !== false ? 'btn-danger' : 'btn-sm-primary') + '" style="flex:1;padding:3px 5px;font-size:11px;white-space:nowrap;" onclick="toggleAgentStatus(\'' + escapeHtml(a.email || a._id) + '\', ' + (a.isActive !== false) + ')">' + (a.isActive !== false ? 'Suspend' : 'Activate') + '</button>' +
                    '</div>' +
                    '</div>'
                );
            }).join('');
        } else {
            countLabel.textContent = '0 total';
            list.innerHTML = '<div class="empty-state">No agents registered yet</div>';
        }
    })
    .catch(function(e) { console.error('Agents load error:', e); });
}

function loadProperties() {
    fetch(API + '/api/admin/properties', { headers: { 'Authorization': 'Bearer ' + getToken() } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var list = document.getElementById('propertyList');
        var countLabel = document.getElementById('propCountLabel');
        if (data.success && data.properties.length > 0) {
            countLabel.textContent = data.properties.length + ' total';
            // Show most recent first
            var sorted = data.properties.slice().sort(function(a, b) {
                var da = a.createdAt ? new Date(a.createdAt) : new Date(0);
                var db = b.createdAt ? new Date(b.createdAt) : new Date(0);
                return db - da;
            });
            list.innerHTML = sorted.slice(0, 50).map(function(p) {
                var status = p.status || 'draft';
                var created = p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '—';
                var price = p.price || p.displayPrice || '—';
                var agentEmail = p.agentEmail || p.createdBy || '—';
                return (
                    '<div class="prop-row">' +
                    '<div style="font-weight:500;">' + escapeHtml((p.title || 'Untitled').substring(0, 40)) + '</div>' +
                    '<div style="font-size:12px;color:#64748b;">' + escapeHtml(agentEmail) + '</div>' +
                    '<div style="color:#34d399;font-weight:600;">' + escapeHtml(String(price)) + '</div>' +
                    '<div style="font-family:monospace;font-size:12px;color:#818cf8;">' + escapeHtml((p.slug || '—').substring(0, 30)) + '</div>' +
                    '<div><span class="status-badge ' + (status === 'active' ? 'status-active' : '') + '">' + status.toUpperCase() + '</span></div>' +
                    '<div style="font-size:12px;color:#64748b;">' + created + '</div>' +
                    '</div>'
                );
            }).join('');
            if (data.properties.length > 50) {
                list.innerHTML += '<div style="text-align:center;padding:12px;color:#64748b;font-size:12px;">Showing 50 of ' + data.properties.length + ' properties</div>';
            }
        } else {
            countLabel.textContent = '0 total';
            list.innerHTML = '<div class="empty-state">No properties yet</div>';
        }
    })
    .catch(function(e) { console.error('Properties load error:', e); });
}

function viewAgent(agentId) {
    fetch(API + '/api/admin/agents/' + encodeURIComponent(agentId), { headers: { 'Authorization': 'Bearer ' + getToken() } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var modal = document.getElementById('agentModal');
        var body = document.getElementById('modalBody');
        if (data.success && data.agent) {
            var a = data.agent;
            var propsHtml = '';
            if (a.properties && a.properties.length > 0) {
                propsHtml = '<div style="margin-top:16px;"><strong style="font-size:13px;color:#94a3b8;">Properties (' + a.properties.length + '):</strong></div>';
                propsHtml += a.properties.map(function(p) {
                    return '<div style="padding:6px 0;border-bottom:1px solid #2a2d37;font-size:13px;">' +
                        escapeHtml(p.title || 'Untitled') + ' — <span style="color:#34d399;">' + escapeHtml(p.price || '—') + '</span></div>';
                }).join('');
            }
            var bookingsHtml = '';
            if (a.bookings && a.bookings.length > 0) {
                bookingsHtml = '<div style="margin-top:12px;"><strong style="font-size:13px;color:#94a3b8;">Bookings (' + a.bookings.length + '):</strong></div>';
                bookingsHtml += a.bookings.map(function(b) {
                    return '<div style="padding:6px 0;border-bottom:1px solid #2a2d37;font-size:13px;">' +
                        escapeHtml(b.clientName || 'Unknown') + ' — ' + (b.date ? new Date(b.date).toLocaleDateString() : '—') + '</div>';
                }).join('');
            }
            body.innerHTML =
                '<div class="form-group"><label>Name</label><input type="text" id="editAgentName" value="' + escapeHtml(a.name || '') + '"></div>' +
                '<div class="form-group"><label>Email</label><input type="text" value="' + escapeHtml(a.email || '') + '" disabled style="opacity:0.6;"></div>' +
                '<div class="form-group"><label>Company</label><input type="text" id="editAgentCompany" value="' + escapeHtml(a.companyName || '') + '"></div>' +
                '<div class="form-group"><label>Plan</label><select id="editAgentPlan">' +
                    '<option value="pro"' + (a.plan === 'pro' ? ' selected' : '') + '>Pro</option>' +
                    '<option value="pro-annual"' + (a.plan === 'pro-annual' ? ' selected' : '') + '>Pro Annual</option>' +
                    '<option value="starter"' + (a.plan === 'starter' || !a.plan ? ' selected' : '') + '>Starter</option>' +
                '</select></div>' +
                '<div class="form-group"><label>Agent Page</label><input type="text" value="viewing.one/' + escapeHtml(a.slug || '') + '" disabled style="opacity:0.6;"></div>' +
                (propsHtml || '') +
                (bookingsHtml || '') +
                '<div id="modalMsg"></div>';
            document.getElementById('modalTitle').textContent = '👤 ' + (a.name || 'Agent') + ' — Details';

            // Add save button
            var btnRow = modal.querySelector('.btn-row');
            btnRow.innerHTML =
                '<button class="btn-primary" onclick="saveAgent(\'' + escapeHtml(a.email || '') + '\')">💾 Save Changes</button>' +
                '<button class="btn-cancel" onclick="closeAgentModal()">Close</button>';

            modal.classList.add('show');
        }
    })
    .catch(function(e) { console.error('View agent error:', e); });
}

function closeAgentModal() {
    document.getElementById('agentModal').classList.remove('show');
}

function saveAgent(agentEmail) {
    var data = {
        name: document.getElementById('editAgentName').value,
        companyName: document.getElementById('editAgentCompany').value,
        plan: document.getElementById('editAgentPlan').value
    };

    fetch(API + '/api/admin/agents/' + encodeURIComponent(agentEmail), {
        method: 'PATCH',
        headers: apiHeaders(),
        body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .then(function(resp) {
        var msgEl = document.getElementById('modalMsg');
        if (resp.success) {
            msgEl.className = 'msg success';
            msgEl.textContent = 'Agent updated successfully!';
            setTimeout(closeAgentModal, 1000);
            loadAgents();
        } else {
            msgEl.className = 'msg error';
            msgEl.textContent = resp.message || 'Update failed';
        }
    })
    .catch(function() {
        document.getElementById('modalMsg').className = 'msg error';
        document.getElementById('modalMsg').textContent = 'Connection error';
    });
}

function toggleAgentStatus(agentId, isCurrentlyActive) {
    if (!confirm((isCurrentlyActive ? 'Suspend' : 'Activate') + ' this agent?')) return;

    fetch(API + '/api/admin/agents/' + encodeURIComponent(agentId), {
        method: 'PATCH',
        headers: apiHeaders(),
        body: JSON.stringify({ isActive: !isCurrentlyActive })
    })
    .then(function(r) { return r.json(); })
    .then(function(resp) {
        if (resp.success) {
            loadAgents();
        } else {
            alert('Error: ' + (resp.message || 'Update failed'));
        }
    })
    .catch(function() { alert('Connection error'); });
}

function resetAgentPw(agentId, agentName) {
    var newPw = prompt('Enter new password for ' + agentName + ' (min 6 chars):');
    if (!newPw || newPw.length < 6) {
        if (newPw) alert('Password must be at least 6 characters');
        return;
    }
    if (!confirm('Reset password for ' + agentName + '?')) return;

    fetch(API + '/api/admin/agents/' + encodeURIComponent(agentId) + '/reset-password', {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({ newPassword: newPw })
    })
    .then(function(r) { return r.json(); })
    .then(function(resp) {
        if (resp.success) {
            alert('✅ ' + resp.message);
        } else {
            alert('Error: ' + (resp.message || 'Reset failed'));
        }
    })
    .catch(function() { alert('Connection error'); });
}

function escapeHtml(t) {
    if (typeof t !== 'string') return String(t || '');
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(t));
    return d.innerHTML;
}

// Auto-refresh every 30 seconds
setInterval(loadStats, 30000);
</script>
